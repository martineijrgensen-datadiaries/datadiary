<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">
  <defs>
    <filter id="shadow-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="0" flood-color="#C4BEAA" flood-opacity="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" fill="#F7F3EA"/>

  <!-- Title, hand-written feel, no header bar -->
  <text x="500" y="50" text-anchor="middle" font-size="22" font-weight="700" fill="#1C1A2A">Two ways to ask, one set of rules</text>
  <text x="500" y="74" text-anchor="middle" font-size="13" fill="#8A8799">it doesn't matter who writes the letter, the mailbox reads it the same way</text>

  <!-- ══════════════════════════════════════════════════════
       LEFT SPEECH BUBBLE — drag a field
  ══════════════════════════════════════════════════════════ -->
  <rect x="45" y="120" width="270" height="150" rx="45" fill="#FDFAF4" stroke="#1C1A2A" stroke-width="2.5" filter="url(#shadow-sm)"/>
  <!-- speech tail -->
  <path d="M 250 262 Q 275 285 300 300 Q 270 292 245 275 Z" fill="#FDFAF4" stroke="#1C1A2A" stroke-width="2.5"/>

  <text x="180" y="168" text-anchor="middle" font-size="34">🖱️</text>
  <text x="180" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1A2A">"I just drag a field</text>
  <text x="180" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1A2A">onto a chart!"</text>
  <text x="180" y="252" text-anchor="middle" font-size="11" fill="#8A8799">(Power BI writes the letter for you)</text>

  <!-- ══════════════════════════════════════════════════════
       RIGHT SPEECH BUBBLE — write SQL
  ══════════════════════════════════════════════════════════ -->
  <rect x="45" y="330" width="270" height="150" rx="45" fill="#FDFAF4" stroke="#1C1A2A" stroke-width="2.5" filter="url(#shadow-sm)"/>
  <!-- speech tail -->
  <path d="M 250 340 Q 275 315 300 300 Q 270 310 245 328 Z" fill="#FDFAF4" stroke="#1C1A2A" stroke-width="2.5"/>

  <text x="180" y="378" text-anchor="middle" font-size="34">⌨️</text>
  <text x="180" y="418" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1A2A">"I write the SQL</text>
  <text x="180" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#1C1A2A">myself, thanks."</text>
  <text x="180" y="462" text-anchor="middle" font-size="11" fill="#8A8799">(that's me, eventually, in this post)</text>

  <!-- ══════════════════════════════════════════════════════
       PATHS merging + paper airplane
  ══════════════════════════════════════════════════════════ -->
  <path d="M 300 300 Q 400 220 480 285" fill="none" stroke="#7BBFD4" stroke-width="2.5" stroke-dasharray="1,10" stroke-linecap="round"/>
  <path d="M 300 300 Q 400 380 480 300" fill="none" stroke="#E86A47" stroke-width="2.5" stroke-dasharray="1,10" stroke-linecap="round"/>

  <text x="500" y="278" text-anchor="middle" font-size="30" transform="rotate(8 500 278)">✉️</text>
  <text x="500" y="315" text-anchor="middle" font-size="11" fill="#8A8799">both become the same</text>
  <text x="500" y="330" text-anchor="middle" font-size="11" fill="#8A8799">little request for data</text>

  <path d="M 545 295 Q 600 270 650 288" fill="none" stroke="#8A8799" stroke-width="2.5" stroke-dasharray="1,10" stroke-linecap="round"/>
  <polygon points="646,278 662,289 645,298" fill="#8A8799"/>

  <!-- ══════════════════════════════════════════════════════
       MAILBOX — Adobe
  ══════════════════════════════════════════════════════════ -->
  <!-- legs -->
  <rect x="720" y="470" width="14" height="40" rx="6" fill="#1C1A2A"/>
  <rect x="880" y="470" width="14" height="40" rx="6" fill="#1C1A2A"/>

  <!-- body -->
  <rect x="690" y="300" width="240" height="180" rx="34" fill="#FDFAF4" stroke="#1C1A2A" stroke-width="2.5" filter="url(#shadow-sm)"/>
  <!-- roof -->
  <path d="M 685 300 Q 810 210 935 300 Z" fill="#E86A47" stroke="#1C1A2A" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- mail slot -->
  <rect x="760" y="352" width="100" height="18" rx="9" fill="#1C1A2A"/>

  <!-- cute face -->
  <circle cx="770" cy="410" r="7" fill="#1C1A2A"/>
  <circle cx="850" cy="410" r="7" fill="#1C1A2A"/>
  <path d="M 775 435 Q 810 458 845 435" fill="none" stroke="#1C1A2A" stroke-width="4" stroke-linecap="round"/>

  <text x="810" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="white">Adobe</text>

  <!-- ══════════════════════════════════════════════════════
       LITTLE FLAGS on strings — the 3 rules
  ══════════════════════════════════════════════════════════ -->
  <line x1="640" y1="150" x2="980" y2="150" stroke="#C4BEAA" stroke-width="2"/>

  <line x1="700" y1="150" x2="700" y2="180" stroke="#C4BEAA" stroke-width="2"/>
  <path d="M 670 180 L 730 180 L 700 215 Z" fill="#7DB840" stroke="#1C1A2A" stroke-width="2" stroke-linejoin="round"/>
  <text x="700" y="198" text-anchor="middle" font-size="14">➕</text>

  <line x1="810" y1="150" x2="810" y2="180" stroke="#C4BEAA" stroke-width="2"/>
  <path d="M 780 180 L 840 180 L 810 215 Z" fill="#7BBFD4" stroke="#1C1A2A" stroke-width="2" stroke-linejoin="round"/>
  <text x="810" y="198" text-anchor="middle" font-size="14">📅</text>

  <line x1="920" y1="150" x2="920" y2="180" stroke="#C4BEAA" stroke-width="2"/>
  <path d="M 890 180 L 950 180 L 920 215 Z" fill="#F5A623" stroke="#1C1A2A" stroke-width="2" stroke-linejoin="round"/>
  <text x="920" y="198" text-anchor="middle" font-size="14">🔢</text>

  <text x="700" y="238" text-anchor="middle" font-size="11" fill="#1C1A2A" font-weight="600">totals only</text>
  <text x="810" y="238" text-anchor="middle" font-size="11" fill="#1C1A2A" font-weight="600">needs a date</text>
  <text x="920" y="238" text-anchor="middle" font-size="11" fill="#1C1A2A" font-weight="600">max 50 rows</text>

  <!-- footer caption -->
  <text x="500" y="536" text-anchor="middle" font-size="12" fill="#8A8799">Doesn't matter which speech bubble it came from — the mailbox has the same three rules pinned up either way.</text>

</svg>
