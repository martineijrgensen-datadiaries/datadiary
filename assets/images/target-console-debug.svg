<circle cx="55" cy="880" r="11" fill="#F07A5F" stroke="#1C1A2A" stroke-width="2"/>
<text x="55" y="884.5" font-size="12.5" fill="#1C1A2A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="800" text-anchor="middle">1</text>
<text x="76" y="885" font-size="15" fill="#1C1A2A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="700">Is the Web SDK running?</text>
<text x="76" y="906" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">Yep. It's up and running, and consent is</text>
<text x="76" y="925" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">in place. No line like this? Then nothing</text>
<text x="76" y="944" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">else will happen either.</text>
<circle cx="450.0" cy="880" r="11" fill="#F07A5F" stroke="#1C1A2A" stroke-width="2"/>
<text x="450.0" y="884.5" font-size="12.5" fill="#1C1A2A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="800" text-anchor="middle">2</text>
<text x="471.0" y="885" font-size="15" fill="#1C1A2A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="700">Did Target choose an activity?</text>
<text x="471.0" y="906" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">Yes, and it even tells you which one.</text>
<text x="471.0" y="925" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">Activity name and experience, right there.</text>
<circle cx="55" cy="976" r="11" fill="#F07A5F" stroke="#1C1A2A" stroke-width="2"/>
<text x="55" y="980.5" font-size="12.5" fill="#1C1A2A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="800" text-anchor="middle">3</text>
<text x="76" y="981" font-size="15" fill="#1C1A2A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="700">Did the change get onto the page?</text>
<text x="76" y="1002" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">It says executed. So if you still can't</text>
<text x="76" y="1021" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">see the change, I'd look at the script.</text>
<circle cx="450.0" cy="976" r="11" fill="#F07A5F" stroke="#1C1A2A" stroke-width="2"/>
<text x="450.0" y="980.5" font-size="12.5" fill="#1C1A2A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="800" text-anchor="middle">4</text>
<text x="471.0" y="981" font-size="15" fill="#1C1A2A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif" font-weight="700">Was I counted?</text>
<text x="471.0" y="1002" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">The sneaky one. A sendEvent with no type,</text>
<text x="471.0" y="1021" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">sent right after Target answers. Expand</text>
<text x="471.0" y="1040" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">the request below it and look for</text>
<text x="471.0" y="1059" font-size="13.5" fill="#55526A" font-family="'Inter', ui-sans-serif, system-ui, sans-serif">display: 1 and your activity ID.</text>
